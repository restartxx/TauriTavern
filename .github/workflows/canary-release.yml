name: Canary Release (Android ARMv8.2-A)

on:
  workflow_dispatch:

concurrency:
  group: canary-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAURITAVERN_BUILD_BRANCH: dev
  TAURITAVERN_BUILD_REVISION: ${{ github.sha }}
  # Flags globais de otimização Rust para ARMv8.2-A (Cortex-A77/A55)
  RUSTFLAGS: "-C target-cpu=cortex-a77 -C target-feature=+v8.2a"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      asset_time: ${{ steps.metadata.outputs.asset_time }}
      display_time: ${{ steps.metadata.outputs.display_time }}
      previous_sha: ${{ steps.metadata.outputs.previous_sha }}
      sha12: ${{ steps.metadata.outputs.sha12 }}
      stable_version: ${{ steps.metadata.outputs.stable_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Canary metadata
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force origin refs/tags/Canary:refs/tags/Canary || true
          previous_sha=$(git rev-parse Canary^{commit} 2>/dev/null || echo "$GITHUB_SHA")
          stable_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo "v1.0.0")
          if [[ "$stable_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            stable_version=${BASH_REMATCH[1]}
          else
            stable_version="1.0.0"
          fi
          {
            echo "asset_time=$(TZ=Asia/Shanghai date +'%Y%m%d')"
            echo "display_time=$(TZ=Asia/Shanghai date +'%Y.%m.%d')"
            echo "previous_sha=$previous_sha"
            echo "sha12=${GITHUB_SHA:0:12}"
            echo "stable_version=$stable_version"
          } >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            src-tauri/crates/tauritavern/gen/android/**/*.gradle*
            src-tauri/crates/tauritavern/gen/android/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Configure Android compiler
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          sysroot="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          {
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android24-clang"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$sysroot"
          } >> "$GITHUB_ENV"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Enable HTTP access for mobile bundle
        run: ./scripts/ci/configure-mobile-http.sh enable android || true

      - name: Setup Android signing
        shell: bash
        run: |
          cd src-tauri/crates/tauritavern/gen/android
          keystore_path="$RUNNER_TEMP/keystore.jks"

          if [ -n "${{ secrets.ANDROID_KEY_BASE64 }}" ]; then
            echo "Uso de secrets do repositório..."
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
            echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
            base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$keystore_path"
            echo "storeFile=$keystore_path" >> keystore.properties
          else
            echo "Secrets não encontradas no fork. Gerando keystore temporária para compilação..."
            keytool -genkeypair -v -keystore "$keystore_path" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias temp-key -storepass 123456 -keypass 123456 \
              -dname "CN=TauriTavern, O=Test, C=US"

            echo "keyAlias=temp-key" > keystore.properties
            echo "password=123456" >> keystore.properties
            echo "storeFile=$keystore_path" >> keystore.properties
          fi

      - name: Build mobile bundle (aarch64 ARMv8.2-A)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # Otimização C/C++ via NDK Clang para Cortex-A77 / ARMv8.2-A
          CFLAGS_aarch64_linux_android: "-march=armv8.2-a -mcpu=cortex-a77"
          CXXFLAGS_aarch64_linux_android: "-march=armv8.2-a -mcpu=cortex-a77"
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          mobile: android
          args: --verbose --apk --target aarch64
          uploadWorkflowArtifacts: true
          uploadPlainBinary: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          workflowArtifactNamePattern: 'TauriTavern-${{ needs.prepare.outputs.asset_time }}-canary-android-aarch64-[bundle]'

  publish:
    needs: [prepare, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISPLAY_TIME: ${{ needs.prepare.outputs.display_time }}
      SHA12: ${{ needs.prepare.outputs.sha12 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: 'TauriTavern-*-canary-*'
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Release (Canary)
        shell: bash
        run: |
          set -euo pipefail

          # Garante a existência da release
          if ! gh release view Canary --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create Canary --repo "$GITHUB_REPOSITORY" \
              --title "Canary Release $DISPLAY_TIME" \
              --notes "Canary Android ARMv8.2-A build dev@$SHA12" \
              --prerelease
          fi

          # Upload dos APKs gerados
          find dist -type f \( -name "*.apk" -o -name "*.aab" \) -print0 \
            | xargs -0 gh release upload Canary --repo "$GITHUB_REPOSITORY" --clobber

          # Atualiza a tag Canary apontando para o commit atual
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/git/refs/tags/Canary" \
            -f sha="$GITHUB_SHA" \
            -F force=true || true
